[tool]
name        = CYS-ILM Reconnaissance Tool
version     = 3.0.0
author      = CYS-ILM Security Team

[scan]
default_ports    = 1-1000
quick_ports      = 21,22,23,25,53,80,110,143,443,445,993,995,3389,8080,8443
default_timing   = 3
connect_timeout  = 6
max_threads      = 25

[passive]
request_timeout  = 8
rate_limit_sec   = 1.5
max_subdomains   = 100
common_sub_limit = 35

[output]
default_format = txt
output_dir     = outputs
